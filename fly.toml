# Fly.io config for the BuddySync sync server (the Next.js app stays on Vercel).
# Setup and first deploy: docs/deploy-sync-server.md.
#
# Run exactly ONE machine. Each room lives in the memory of one process, and there is no
# room ownership across nodes yet (leases and fencing are planned), so two machines would
# each sequence the same board on their own and corrupt it. Deploy with `--ha=false`.

app = "boardbuddy-sync" # change to your app name
primary_region = "iad" # near Vercel's and Convex's default (US East); pick the region nearest your users

# SIGTERM makes the server flush every room's pending writes and close sockets cleanly
# (clients reconnect and resend anything unacked). 30 s is far more than a flush needs.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "packages/sync-server/Dockerfile"

[deploy]
  # Applies migrations/*.sql before the new version starts. Needs DATABASE_URL.
  release_command = "node dist/migrate.mjs"
  # Never bluegreen or canary: both run old and new machines at once (see above).
  strategy = "rolling"

[env]
  PORT = "8080"
  # Browser origins allowed to open a socket, comma-separated. Set to your site, e.g.
  # ALLOWED_ORIGINS = "https://boardbuddy.example.com"
  # Unset allows any origin (every connection still needs a signed room token).

# Secrets (never in this file):
#   fly secrets set SYNC_PUBLIC_KEY="..." DATABASE_URL="postgres://..."

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when nobody is connected (open WebSockets count as connections), start on the
  # next request. Rooms reload from Postgres on start.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1500

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
